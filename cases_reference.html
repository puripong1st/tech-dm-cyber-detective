<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังแฟ้มคดี & เฉลยฉบับครูผู้สอน (Cyber Law Case Bank & Answer Keys)</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Cases Data Bank -->
    <script src="cases_data.js"></script>

    <style>
        :root {
            --bg-dark: #070913;
            --bg-card: #0f172a;
            --bg-surface: #1e293b;
            --neon-cyan: #38bdf8;
            --neon-green: #10b981;
            --neon-yellow: #f59e0b;
            --neon-magenta: #f43f5e;
            --neon-purple: #a855f7;
            --font-main: 'Kanit', 'Sarabun', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: #f8fafc;
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(168, 85, 247, 0.08) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Top Header Navigation */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid rgba(56, 189, 248, 0.25);
            border-radius: 18px;
            padding: 16px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            flex-wrap: wrap;
            gap: 16px;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .nav-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--neon-cyan);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .btn-home {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-home:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
        }

        /* Lock Status Header Banner */
        .lock-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.7);
            border: 1.5px solid #334155;
            border-radius: 16px;
            padding: 18px 24px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .lock-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .lock-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .badge-locked {
            background: rgba(244, 63, 94, 0.15);
            border: 1.5px solid var(--neon-magenta);
            color: var(--neon-magenta);
        }

        .badge-unlocked {
            background: rgba(16, 185, 129, 0.15);
            border: 1.5px solid var(--neon-green);
            color: var(--neon-green);
        }

        .btn-auth-toggle {
            padding: 10px 20px;
            border-radius: 12px;
            font-family: var(--font-main);
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
            transition: all 0.25s;
        }

        .btn-auth-unlock {
            background: linear-gradient(135deg, var(--neon-yellow), #d97706);
            color: #090d16;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35);
        }

        .btn-auth-lock {
            background: rgba(244, 63, 94, 0.15);
            border: 1.5px solid var(--neon-magenta);
            color: var(--neon-magenta);
        }

        /* Filter Controls */
        .filter-box {
            display: flex;
            gap: 12px;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            border: 1.5px solid #334155;
            padding: 14px 20px;
            border-radius: 14px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 260px;
            padding: 10px 16px;
            border-radius: 10px;
            border: 1.5px solid #334155;
            background: #090d16;
            color: #fff;
            font-family: var(--font-main);
            font-size: 0.95rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .stat-count-tag {
            font-weight: 700;
            color: var(--neon-cyan);
            font-size: 0.9rem;
        }

        /* Cases Grid */
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 24px;
        }

        /* Individual Case Card */
        .case-card {
            background: rgba(15, 23, 42, 0.9);
            border: 1.5px solid #334155;
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transition: border-color 0.3s ease, transform 0.2s ease;
        }

        .case-card:hover {
            border-color: rgba(56, 189, 248, 0.5);
        }

        .case-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
        }

        .case-id-badge {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-weight: 800;
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 10px;
            white-space: nowrap;
        }

        .case-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.4;
        }

        .case-brief-box {
            background: rgba(30, 41, 59, 0.6);
            border-left: 3px solid var(--neon-yellow);
            border-radius: 0 10px 10px 0;
            padding: 12px 14px;
            font-size: 0.92rem;
            color: #e2e8f0;
            line-height: 1.5;
        }

        .clues-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .section-label {
            font-size: 0.82rem;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .clue-item {
            background: rgba(9, 13, 22, 0.8);
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.86rem;
            color: #cbd5e1;
        }

        .clue-title {
            font-weight: 700;
            color: var(--neon-cyan);
            margin-bottom: 2px;
        }

        /* Law & Penalty Options */
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-item {
            background: #090d16;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.88rem;
            color: #cbd5e1;
            transition: all 0.25s ease;
            position: relative;
        }

        .option-title {
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 2px;
        }

        .option-desc {
            font-size: 0.82rem;
            color: #94a3b8;
        }

        /* HIGHLIGHTED CORRECT ANSWER KEY (For Unlocked Mode) */
        .option-correct-unlocked {
            background: rgba(16, 185, 129, 0.12) !important;
            border: 1.5px solid var(--neon-green) !important;
            color: #fff !important;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.25);
        }

        .option-correct-unlocked .option-title {
            color: var(--neon-green) !important;
        }

        .correct-badge-icon {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--neon-green);
            color: #090d16;
            font-weight: 900;
            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: 6px;
            margin-left: 6px;
        }

        /* LOCKED ANSWER OVERLAY */
        .locked-answer-box {
            background: rgba(244, 63, 94, 0.08);
            border: 1.5px dashed var(--neon-magenta);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .locked-answer-box:hover {
            background: rgba(244, 63, 94, 0.15);
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.2);
        }

        .locked-title {
            color: var(--neon-magenta);
            font-weight: 800;
            font-size: 0.92rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .locked-subtitle {
            color: #94a3b8;
            font-size: 0.8rem;
        }

        /* Unlocked Teacher Answer Box */
        .unlocked-answer-box {
            background: rgba(16, 185, 129, 0.08);
            border: 1.5px solid var(--neon-green);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .unlocked-header {
            color: var(--neon-green);
            font-weight: 800;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Auth Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(7, 9, 19, 0.96);
            backdrop-filter: blur(10px);
            z-index: 300;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: #0f172a;
            border: 2px solid var(--neon-yellow);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 50px rgba(245, 158, 11, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1.5px solid #334155;
            background: #090d16;
            color: #fff;
            font-family: var(--font-main);
            font-size: 1rem;
            outline: none;
            margin-bottom: 16px;
        }

        .form-input:focus {
            border-color: var(--neon-yellow);
        }

        .btn-modal-submit {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--neon-yellow), #d97706);
            color: #090d16;
            font-family: var(--font-main);
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-modal-close {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 0.88rem;
            cursor: pointer;
            margin-top: 12px;
            font-family: var(--font-main);
        }

        .btn-modal-close:hover {
            color: #fff;
        }

        @media (max-width: 768px) {
            .cases-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Passcode Auth Modal -->
    <div class="modal-overlay" id="modal-auth">
        <div class="auth-card">
            <div style="font-size: 3rem; color: var(--neon-yellow); margin-bottom: 12px;"><i class="fa-solid fa-key"></i></div>
            <h3 style="color: var(--neon-yellow); font-size: 1.4rem; font-weight: 800; margin-bottom: 6px;">ปลดล็อกเฉลยฉบับครูผู้สอน</h3>
            <p style="font-size: 0.88rem; color: #cbd5e1; margin-bottom: 20px;">กรอกรหัสผ่านครูผู้สอนเพื่อดูคำตอบและเฉลยคำอธิบายทุกคดี</p>

            <input type="password" class="form-input" id="input-passcode" placeholder="รหัสผ่านครูผู้สอน (Passcode)">

            <button class="btn-modal-submit" id="btn-submit-passcode">
                <i class="fa-solid fa-lock-open"></i> ยืนยันรหัสผ่านเพื่อเฉลย
            </button>

            <button class="btn-modal-close" id="btn-close-modal">ยกเลิก / ปิดหน้าต่าง</button>
        </div>
    </div>

    <div class="container">

        <!-- Top Navigation -->
        <header class="top-nav">
            <div class="nav-brand">
                <div style="font-size: 2rem; color: var(--neon-cyan);"><i class="fa-solid fa-folder-tree"></i></div>
                <div>
                    <h1 class="nav-title">คลังแฟ้มคดี & เฉลยฉบับครูผู้สอน</h1>
                    <p class="nav-subtitle">รวบรวมคดี พ.ร.บ. คอมพิวเตอร์ และ PDPA ทั้งหมด 30 คดีพร้อมเฉลย</p>
                </div>
            </div>

            <a href="/" class="btn-home">
                <i class="fa-solid fa-house"></i> กลับหน้าหลัก
            </a>
        </header>

        <!-- Passcode Lock Banner -->
        <div class="lock-banner">
            <div class="lock-info">
                <div class="lock-badge badge-locked" id="status-badge">
                    <i class="fa-solid fa-lock" id="status-icon"></i>
                    <span id="status-text">สถานะเฉลย: ล็อกอยู่ (ซ่อนเฉลยสำหรับนักเรียน)</span>
                </div>
            </div>

            <button class="btn-auth-toggle btn-auth-unlock" id="btn-toggle-auth">
                <i class="fa-solid fa-key" id="btn-icon"></i>
                <span id="btn-text">🔑 ปลดล็อกเฉลย (สำหรับครูผู้สอน)</span>
            </button>
        </div>

        <!-- Filter Controls -->
        <div class="filter-box">
            <input type="text" class="search-input" id="input-search" placeholder="🔍 ค้นหาตามชื่อคดี / ข้อหากฎหมาย / มาตรา / คำร้องทุกข์...">
            <span class="stat-count-tag" id="stat-count">แสดงผล 30 / 30 คดี</span>
        </div>

        <!-- Cases Container Grid -->
        <main class="cases-grid" id="cases-container">
            <!-- Dynamic Cases Loaded Here -->
        </main>

    </div>

    <script>
        let isUnlocked = false;

        function checkTeacherAuth() {
            const auth = sessionStorage.getItem('teacher_authenticated');
            if (auth === 'true') {
                isUnlocked = true;
            }
            updateAuthUI();
        }

        function updateAuthUI() {
            const badge = document.getElementById('status-badge');
            const icon = document.getElementById('status-icon');
            const text = document.getElementById('status-text');
            const btn = document.getElementById('btn-toggle-auth');
            const btnIcon = document.getElementById('btn-icon');
            const btnText = document.getElementById('btn-text');

            if (isUnlocked) {
                badge.className = "lock-badge badge-unlocked";
                icon.className = "fa-solid fa-lock-open";
                text.textContent = "สถานะเฉลย: ปลดล็อกเรียบร้อย (แสดงเฉลยฉบับครูผู้สอน)";

                btn.className = "btn-auth-toggle btn-auth-lock";
                btnIcon.className = "fa-solid fa-eye-slash";
                btnText.textContent = "🔒 ซ่อนเฉลย (สำหรับแสดงผลให้นักเรียนดู)";
            } else {
                badge.className = "lock-badge badge-locked";
                icon.className = "fa-solid fa-lock";
                text.textContent = "สถานะเฉลย: ล็อกอยู่ (ซ่อนเฉลยสำหรับนักเรียน)";

                btn.className = "btn-auth-toggle btn-auth-unlock";
                btnIcon.className = "fa-solid fa-key";
                btnText.textContent = "🔑 ปลดล็อกเฉลย (สำหรับครูผู้สอน)";
            }

            renderCases();
        }

        // Modal Controls
        const modalAuth = document.getElementById('modal-auth');
        const inputPasscode = document.getElementById('input-passcode');
        const btnSubmit = document.getElementById('btn-submit-passcode');
        const btnClose = document.getElementById('btn-close-modal');
        const btnToggleAuth = document.getElementById('btn-toggle-auth');

        btnToggleAuth.addEventListener('click', () => {
            if (isUnlocked) {
                isUnlocked = false;
                updateAuthUI();
            } else {
                modalAuth.style.display = 'flex';
                inputPasscode.focus();
            }
        });

        btnClose.addEventListener('click', () => {
            modalAuth.style.display = 'none';
        });

        btnSubmit.addEventListener('click', verifyPasscode);
        inputPasscode.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verifyPasscode();
        });

        async function verifyPasscode() {
            const val = inputPasscode.value.trim();
            let validPass = (val === 'admin123' || val === 'teacher123');

            try {
                if (window.location.protocol.startsWith('http')) {
                    const res = await fetch('/api/verify-passcode', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ passcode: val })
                    });
                    const data = await res.json();
                    if (data && data.success) validPass = true;
                }
            } catch(e) {}

            if (validPass) {
                sessionStorage.setItem('teacher_authenticated', 'true');
                isUnlocked = true;
                modalAuth.style.display = 'none';
                inputPasscode.value = '';
                updateAuthUI();
            } else {
                alert("รหัสผ่านครูผู้สอนไม่ถูกต้อง! กรุณาลองใหม่อีกครั้ง");
            }
        }

        // Render Cases List
        function renderCases() {
            const container = document.getElementById('cases-container');
            const searchVal = document.getElementById('input-search').value.trim().toLowerCase();

            if (!window.CASES || window.CASES.length === 0) {
                container.innerHTML = `<div style="color: #94a3b8; text-align: center; grid-column: 1/-1;">ไม่พบข้อมูลคดี</div>`;
                return;
            }

            let filtered = window.CASES.filter(c => {
                if (!searchVal) return true;
                const titleMatch = c.title && c.title.toLowerCase().includes(searchVal);
                const briefMatch = c.brief && c.brief.toLowerCase().includes(searchVal);
                const lawMatch = c.lawOptions && c.lawOptions.some(l => l.title.toLowerCase().includes(searchVal) || (l.desc && l.desc.toLowerCase().includes(searchVal)));
                return titleMatch || briefMatch || lawMatch;
            });

            document.getElementById('stat-count').textContent = `แสดงผล ${filtered.length} / ${window.CASES.length} คดี`;

            container.innerHTML = filtered.map(c => {
                const correctLaw = c.lawOptions ? c.lawOptions.find(l => l.correct) : null;
                const correctPenalty = c.penaltyOptions ? c.penaltyOptions.find(p => p.correct) : null;

                const cluesHtml = (c.clues || []).map(clue => `
                    <div class="clue-item">
                        <div class="clue-title">${clue.title}</div>
                        <div>${clue.note}</div>
                    </div>
                `).join('');

                const lawOptionsHtml = (c.lawOptions || []).map(opt => {
                    const isCorrect = isUnlocked && opt.correct;
                    return `
                        <div class="option-item ${isCorrect ? 'option-correct-unlocked' : ''}">
                            <div class="option-title">
                                ${opt.title}
                                ${isCorrect ? '<span class="correct-badge-icon"><i class="fa-solid fa-check"></i> เฉลยถูกต้อง</span>' : ''}
                            </div>
                            <div class="option-desc">${opt.desc || ''}</div>
                        </div>
                    `;
                }).join('');

                const penaltyOptionsHtml = (c.penaltyOptions || []).map(opt => {
                    const isCorrect = isUnlocked && opt.correct;
                    return `
                        <div class="option-item ${isCorrect ? 'option-correct-unlocked' : ''}">
                            <div class="option-title">
                                ${opt.title}
                                ${isCorrect ? '<span class="correct-badge-icon"><i class="fa-solid fa-check"></i> เฉลยถูกต้อง</span>' : ''}
                            </div>
                        </div>
                    `;
                }).join('');

                const teacherAnswerBox = isUnlocked ? `
                    <div class="unlocked-answer-box">
                        <div class="unlocked-header">
                            <i class="fa-solid fa-graduation-cap"></i> สรุปคำอธิบายและเฉลยฉบับครูผู้สอน
                        </div>
                        <div style="font-size: 0.88rem; color: #e2e8f0; line-height: 1.5;">
                            <b>ข้อหารายละเอียด:</b> <span style="color: var(--neon-green); font-weight: 700;">${correctLaw ? correctLaw.title + ' - ' + correctLaw.desc : '-'}</span>
                            <br>
                            <b>อัตราโทษทางกฎหมาย:</b> <span style="color: var(--neon-yellow); font-weight: 700;">${correctPenalty ? correctPenalty.title : '-'}</span>
                        </div>
                    </div>
                ` : `
                    <div class="locked-answer-box" onclick="document.getElementById('modal-auth').style.display='flex'">
                        <div class="locked-title">
                            <i class="fa-solid fa-lock"></i> เฉลยคำตอบและอัตราโทษทางกฎหมายถูกล็อกอยู่
                        </div>
                        <div class="locked-subtitle">คลิกที่นี่เพื่อกรอกรหัสผ่านครูผู้สอน และปลดล็อกเฉลยทุกคดี</div>
                    </div>
                `;

                return `
                    <div class="case-card">
                        <div class="case-card-header">
                            <h2 class="case-title">${c.title}</h2>
                            <span class="case-id-badge">คดี #${String(c.id).padStart(2, '0')}</span>
                        </div>

                        <div class="case-brief-box">
                            <b>📋 คำร้องทุกข์:</b> ${c.brief}
                        </div>

                        <div class="clues-section">
                            <div class="section-label"><i class="fa-solid fa-magnifying-glass"></i> หลักฐานสืบสวน (Clues)</div>
                            ${cluesHtml}
                        </div>

                        <div class="options-group">
                            <div class="section-label"><i class="fa-solid fa-gavel"></i> ตัวเลือกข้อหากฎหมาย</div>
                            ${lawOptionsHtml}
                        </div>

                        <div class="options-group">
                            <div class="section-label"><i class="fa-solid fa-scale-balanced"></i> ตัวเลือกอัตราโทษ</div>
                            ${penaltyOptionsHtml}
                        </div>

                        ${teacherAnswerBox}
                    </div>
                `;
            }).join('');
        }

        document.getElementById('input-search').addEventListener('input', renderCases);

        checkTeacherAuth();
    </script>
</body>
</html>
