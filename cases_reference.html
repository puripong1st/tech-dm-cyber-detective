<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังแฟ้มคดี & เฉลยฉบับครูผู้สอน (Cyber Law Case Bank & Answer Keys)</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Favicon & App Icon (256x256) -->
    <link rel="icon" type="image/png" sizes="256x256" href="favicon.png">
    <link rel="apple-touch-icon" sizes="256x256" href="favicon.png">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom App CSS -->
    <link rel="stylesheet" href="css/cases_reference.css">

    <!-- Cases Data Bank -->
    <script src="cases_data.js"></script>

</head>
<body>

    <!-- Passcode Auth Modal -->
    <div class="modal-overlay" id="modal-auth">
        <div class="auth-card">
            <div style="font-size: 3rem; color: var(--neon-yellow); margin-bottom: 12px;"><i class="fa-solid fa-key"></i></div>
            <h3 style="color: var(--neon-yellow); font-size: 1.4rem; font-weight: 800; margin-bottom: 6px;">ปลดล็อกเฉลยฉบับครูผู้สอน</h3>
            <p style="font-size: 0.88rem; color: #cbd5e1; margin-bottom: 20px;">กรอกรหัสผ่านครูผู้สอนเพื่อดูคำตอบและเฉลยคำอธิบายทุกคดี</p>

            <input type="password" class="form-input" id="input-passcode" placeholder="รหัสผ่านครูผู้สอน (Passcode)">

            <button class="btn-modal-submit" id="btn-submit-passcode">
                <i class="fa-solid fa-lock-open"></i> ยืนยันรหัสผ่านเพื่อเฉลย
            </button>

            <button class="btn-modal-close" id="btn-close-modal">ยกเลิก / ปิดหน้าต่าง</button>
        </div>
    </div>

    <div class="container">

        <!-- Top Navigation -->
        <header class="top-nav">
            <div class="nav-brand">
                <img src="favicon.png" alt="Logo" style="width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid var(--neon-cyan);">
                <div>
                    <h1 class="nav-title">คลังแฟ้มคดี & เฉลยฉบับครูผู้สอน</h1>
                    <p class="nav-subtitle">รวบรวมคดี พ.ร.บ. คอมพิวเตอร์ และ PDPA ทั้งหมด 30 คดีพร้อมเฉลย</p>
                </div>
            </div>

            <a href="/" class="btn-home">
                <i class="fa-solid fa-house"></i> กลับหน้าหลัก
            </a>
        </header>

        <!-- Passcode Lock Banner -->
        <div class="lock-banner">
            <div class="lock-info">
                <div class="lock-badge badge-locked" id="status-badge">
                    <i class="fa-solid fa-lock" id="status-icon"></i>
                    <span id="status-text">สถานะเฉลย: ล็อกอยู่ (ซ่อนเฉลยสำหรับนักเรียน)</span>
                </div>
            </div>

            <button class="btn-auth-toggle btn-auth-unlock" id="btn-toggle-auth">
                <i class="fa-solid fa-key" id="btn-icon"></i>
                <span id="btn-text">🔑 ปลดล็อกเฉลย (สำหรับครูผู้สอน)</span>
            </button>
        </div>

        <!-- Filter Controls -->
        <div class="filter-box">
            <input type="text" class="search-input" id="input-search" placeholder="🔍 ค้นหาตามชื่อคดี / ข้อหากฎหมาย / มาตรา / คำร้องทุกข์...">
            <span class="stat-count-tag" id="stat-count">แสดงผล 30 / 30 คดี</span>
        </div>

        <!-- Cases Container Grid -->
        <main class="cases-grid" id="cases-container">
            <!-- Dynamic Cases Loaded Here -->
        </main>

    </div>

    <!-- Page Script -->
    <script src="js/cases_reference.js"></script>
</body>
</html>
